services:
  postgres:
    image: postgres:17
    container_name: replyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: replyflow_db
      POSTGRES_USER: replyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - replyflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replyflow -d replyflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  replyflow_postgres_data:
